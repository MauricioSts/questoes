  <body>
    <div id="root"></div>
    <!--
      Conteúdo estático para quem lê o HTML sem JavaScript (robôs de busca, classificadores
      de filtro web). Fica no <noscript> e não dentro do #root: com JS ligado o navegador nem
      desenha isto, então não há texto piscando antes do React montar.
    -->
    <noscript>
      <main style="max-width:720px;margin:0 auto;padding:32px 16px;font:16px/1.6 system-ui,sans-serif">
        <h1>devconcursado — banco de questões para concursos públicos de TI</h1>
        <p>
          O devconcursado é uma plataforma de estudo por questões para quem se prepara para
          concursos públicos, com foco em carreiras de tecnologia da informação e
          desenvolvimento de software.
        </p>
        <p>
          O estudo é montado em volta da repetição: você responde, vê o gabarito e a explicação
          logo depois, e o que errou volta em intervalos crescentes, no momento em que está
          prestes a ser esquecido.
        </p>
        <p>
          As questões vêm de provas oficiais das bancas, de adaptações dessas provas e de
          questões escritas para reforçar os pontos que mais derrubam. Cada questão diz de onde veio.
        </p>
        <h2>O que a plataforma oferece</h2>
        <ul>
          <li>Trilhas por concurso, cada uma com o seu banco de questões.</li>
          <li>Estudo livre com filtro por matéria, assunto e dificuldade.</li>
          <li>Revisão espaçada: a fila do dia com as questões que você errou.</li>
          <li>Simulados cronometrados, com correção só no fim.</li>
          <li>Caderno de anotações por matéria e questões marcadas para rever.</li>
          <li>Estatísticas de acerto por matéria e por assunto.</li>
          <li>Meta diária de questões e contagem de dias seguidos de estudo.</li>
        </ul>
        <p>
          Para usar a plataforma, ative o JavaScript e <a href="/login">entre na sua conta</a>
          ou <a href="/registro">crie uma</a>.
        </p>
      </main>
    </noscript>
